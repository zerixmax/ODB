services:
  odb-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: olead-board
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/dev.db
      # POSTAVI PRIJE DEPLOYA (vidi .env): AUTH_USER, AUTH_PASSWORD, SESSION_SECRET
      - AUTH_USER=${AUTH_USER:-olead}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    volumes:
      - odb-data:/app/data

volumes:
  odb-data:
    driver: local
